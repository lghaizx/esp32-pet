; =====================================================================
;  ESP32 Pixel Pet  -  PlatformIO project
;  Board   : esp32dev (ESP32-WROOM / WROOM-32)
;  Display : 1.8" SPI TFT, ST7735 128x160 (portrait, no touch)
;            driver & pins configured below via TFT_eSPI build flags
;  Buzzer  : passive buzzer on GPIO14 (driven by tone()/LEDC)
; =====================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^8.3.11

; ---------------------------------------------------------------------
;  TFT_eSPI is fully configured from these compiler flags, so you do NOT
;  have to edit the library's User_Setup.h file.
; ---------------------------------------------------------------------
build_flags =
    -DUSER_SETUP_LOADED=1
    ; --- panel driver : ST7735 128x160 (no touch) ---
    -DST7735_DRIVER=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    ; colour tab: BLACKTAB = no offsets (default). If the image is shifted
    ; or the colours are wrong try:  -DST7735_REDTAB   or  -DST7735_GREENTAB
    ; red<->blue swapped  -> add  -DTFT_RGB_ORDER=TFT_BGR
    ; inverted/negative   -> add  -DTFT_INVERSION_ON
    -DST7735_BLACKTAB=1
    ; --- TFT SPI pins (share the bus with the SD card) ---
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=4
    -DTFT_RST=19
    ; --- fonts we use in the UI (size 1 = GLCD, size 2 = FONT2) ---
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_GFXFF=1
    ; --- speed (ST7735 is happy up to ~27MHz) ---
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=12000000
    -DCORE_DEBUG_LEVEL=1
    ; --- LVGL graphics library ---
    -DLV_CONF_INCLUDE_SIMPLE=1
    -Iinclude
